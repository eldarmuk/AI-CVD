name: Public synthetic checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  public-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pip install --no-build-isolation --no-deps .
      - run: python -m pip check
      - run: python -m pytest
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: cffconvert --validate
      - run: python tools/release_checks.py
      - run: python -m ai_cvd.demo --seed 17 --output outputs/ci-synthetic
      - run: python -m ai_cvd.pipeline demo --subjects 6 --output outputs/ci-pipeline
      - run: python -m ai_cvd.pipeline verify outputs/ci-pipeline/processed
      - run: git diff --exit-code
